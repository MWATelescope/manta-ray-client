[project]
name = "manta-ray-client"
version = "2.0.1"
description = "Python API and helper scripts to interact with the MWA ASVO."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "requests==2.33.0",
    "urllib3>=2.7.0",
    "websocket-client>=1.8.0",
    "rich>=13.7.0",
]

[project.scripts]
mwa_client = "mantaray.scripts.mwa_client:main"

[tool.hatch.build.targets.wheel]
packages = ["mantaray"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov",
    "pytest-mock",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "pre-commit",
]
