[project]
name = "manta-ray-client"
version = "2.0.1"
description = "Python CLI tool and helper scripts to interact with the MWA ASVO API."
readme = "README.md"

requires-python = "==3.11.*"
dependencies = [
    "typer[all]>=0.9.0",
    "httpx>=0.27.0",
    "pydantic[email]>=2.0.0",
    "rich>=13.7.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "python-dateutil>=2.8.0",
    "datamodel-code-generator>=0.25.0",
    "websocket-client>=1.8.0",
]

[project.scripts]
mwa-cli = "mwa_cli.main:app_entry"

[tool.hatch.build.targets.wheel]
packages = ["src/mwa_cli"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/mwa_cli/models/generated.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=4.1.0",
    "pytest-mock",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "types-python-dateutil>=2.8.0",
    "pre-commit",
]
